<svg viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg" width="320" height="100">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#3ECFCF"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3ECFCF;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon background circle -->
  <circle cx="50" cy="50" r="42" fill="url(#glowGrad)" stroke="url(#vaultGrad)" stroke-width="1.5"/>

  <!-- Vault door outer ring -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="url(#vaultGrad)" stroke-width="2.5"/>

  <!-- Vault door body -->
  <circle cx="50" cy="50" r="26" fill="#0f0f1a"/>

  <!-- Vault door bolts (4 corners) -->
  <circle cx="50" cy="22" r="3.5" fill="url(#vaultGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="78" r="3.5" fill="url(#vaultGrad)" filter="url(#glow)"/>
  <circle cx="22" cy="50" r="3.5" fill="url(#vaultGrad)" filter="url(#glow)"/>
  <circle cx="78" cy="50" r="3.5" fill="url(#vaultGrad)" filter="url(#glow)"/>

  <!-- Vault dial center circle -->
  <circle cx="50" cy="50" r="13" fill="#1a1a2e" stroke="url(#vaultGrad)" stroke-width="1.5"/>

  <!-- AI circuit node pattern inside dial -->
  <!-- Center node -->
  <circle cx="50" cy="50" r="3" fill="url(#vaultGrad)" filter="url(#glow)"/>
  <!-- Mini circuit lines -->
  <line x1="50" y1="47" x2="50" y2="41" stroke="#6C63FF" stroke-width="1" opacity="0.7"/>
  <line x1="53" y1="50" x2="59" y2="50" stroke="#3ECFCF" stroke-width="1" opacity="0.7"/>
  <line x1="50" y1="53" x2="50" y2="59" stroke="#6C63FF" stroke-width="1" opacity="0.7"/>
  <line x1="47" y1="50" x2="41" y2="50" stroke="#3ECFCF" stroke-width="1" opacity="0.7"/>
  <!-- Corner circuit nodes -->
  <circle cx="50" cy="40" r="1.8" fill="#6C63FF" opacity="0.9"/>
  <circle cx="60" cy="50" r="1.8" fill="#3ECFCF" opacity="0.9"/>
  <circle cx="50" cy="60" r="1.8" fill="#6C63FF" opacity="0.9"/>
  <circle cx="40" cy="50" r="1.8" fill="#3ECFCF" opacity="0.9"/>

  <!-- Vault handle -->
  <line x1="63" y1="50" x2="72" y2="50" stroke="url(#vaultGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="72" cy="50" r="2.5" fill="url(#vaultGrad)"/>

  <!-- Wordmark -->
  <!-- "AI" in gradient -->
  <text x="105" y="46" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="url(#vaultGrad)" letter-spacing="-0.5">AI</text>
  <!-- "VAULT" in white -->
  <text x="142" y="46" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#f0f0f0" letter-spacing="-0.5">VAULT</text>

  <!-- Tagline -->
  <text x="106" y="65" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="11" fill="#888" letter-spacing="3">REVIEWS &amp; TUTORIALS</text>

  <!-- Subtle separator line under tagline -->
  <line x1="106" y1="70" x2="292" y2="70" stroke="url(#vaultGrad)" stroke-width="0.75" opacity="0.4"/>
</svg>
